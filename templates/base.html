<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        Sabarish Garments
        {% endblock %}
    </title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Google Font -->
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- Main CSS -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>


<body>


<!-- ================= NAVBAR ================= -->

<nav class="main-navbar navbar">

    <div class="container navbar-container">

        <!-- BRAND -->

        <a
            href="{{ url_for('home') }}"
            class="brand"
        >

            <span class="brand-mark">
                SG
            </span>

            <span class="brand-text">
                SABARISH
                <small>GARMENTS</small>
            </span>

        </a>


        <!-- NAVIGATION -->

        <div class="nav-links">

            <a
                href="{{ url_for('home') }}"
                class="nav-link-custom"
            >
                Home
            </a>

            <a
                href="{{ url_for('products') }}"
                class="nav-link-custom"
            >
                Products
            </a>

            <a
                href="{{ url_for('enquiry') }}"
                class="nav-quote-btn"
            >
                Get Quote
                <span>↗</span>
            </a>

        </div>

    </div>

</nav>


<!-- ================= PAGE CONTENT ================= -->

<main>

    {% block content %}

    {% endblock %}

</main>


<!-- ================= AI CHAT BUTTON ================= -->

<button
    type="button"
    class="ai-button"
    onclick="toggleChat()"
    aria-label="Open AI assistant"
>

    <span class="ai-pulse"></span>

    <span class="ai-icon">
        ✦
    </span>

</button>


<!-- ================= AI CHAT ================= -->

<div
    id="ai-chat"
    class="ai-chat-box"
>

    <div class="ai-header">

        <div class="ai-profile">

            <div class="ai-avatar">
                ✦
            </div>

            <div>

                <strong>
                    Sabarish AI
                </strong>

                <span>
                    <i class="online-dot"></i>
                    Online
                </span>

            </div>

        </div>


        <button
            type="button"
            class="ai-close"
            onclick="toggleChat()"
            aria-label="Close AI assistant"
        >
            ×
        </button>

    </div>


    <div
        id="chat-messages"
        class="chat-messages"
    >

        <div class="bot-message">

            👋 Hi! I'm the Sabarish Garments AI assistant.

            <br><br>

            I can help you with:

            <br>
            • Products
            <br>
            • Bulk orders
            <br>
            • MOQ
            <br>
            • Custom garment requirements
            <br>
            • Quote enquiries

        </div>

    </div>


    <div class="chat-input-area">

        <input
            type="text"
            id="chat-input"
            class="chat-input"
            placeholder="Ask about our garments..."
            onkeydown="handleEnter(event)"
            autocomplete="off"
        >

        <button
            type="button"
            class="chat-send"
            onclick="sendMessage()"
            aria-label="Send message"
        >
            →
        </button>

    </div>

</div>


<!-- ================= JAVASCRIPT ================= -->

<script
    src="{{ url_for('static', filename='js/script.js') }}"
></script>


</body>

</html>
